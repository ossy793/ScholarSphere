<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Pritis DPP</title>
  <link rel="icon" type="image/svg+xml" href="/shared/img/favicon.svg">
  <link rel="apple-touch-icon" href="/shared/img/icon-192.png">
  <meta name="theme-color" content="#0077FF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/shared/styles.css">
  <script type="module" src="/js/forgot-password.js"></script>
</head>
<body>
  <main class="auth">
    <a class="brand" href="/"><img src="/shared/img/logo.svg" alt="" width="36" height="36"><span>Pritis <span class="brand-sub">DPP</span></span></a>
    <section class="card" aria-labelledby="title">
      <h1 id="title">Reset your password</h1>

      <p class="alert alert-error" id="error" role="alert" hidden></p>
      <p class="alert alert-success" id="notice" role="status" hidden></p>

      <!-- Step 1: ask for a code -->
      <form method="post" id="email-form" novalidate>
        <p class="muted">Enter the email you signed up with. We'll send you a 6-digit code.</p>
        <label>Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <button type="submit" class="btn btn-primary">Send code</button>
      </form>

      <!-- Step 2: code and new password -->
      <form method="post" id="reset-form" novalidate hidden>
        <p class="muted">If <strong id="sent-to"></strong> has an account, a code is on its way. It expires in 10 minutes.</p>
        <label>Reset code
          <input class="code-input" type="text" name="code" inputmode="numeric" autocomplete="one-time-code"
                 pattern="[0-9]{6}" maxlength="6" required>
        </label>
        <label>New password
          <input type="password" name="new_password" autocomplete="new-password" required minlength="8" maxlength="128"
                 aria-describedby="password-rules">
          <ul class="password-rules" id="password-rules" aria-live="polite"></ul>
          <span class="muted small">This signs you out on your other devices.</span>
        </label>
        <button type="submit" class="btn btn-primary">Set new password</button>
        <p class="muted small center">
          <button type="button" class="btn-link" id="resend">Send a new code</button>
          · <button type="button" class="btn-link" id="change-email">Use a different email</button>
        </p>
      </form>

      <p class="muted small center"><a id="login-link" href="/login.html">Back to log in</a></p>
    </section>
  </main>
</body>
</html>
