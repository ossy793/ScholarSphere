<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Due approvals · Pritis Admin</title>
  <link rel="icon" type="image/svg+xml" href="/shared/img/favicon.svg">
  <meta name="theme-color" content="#0077FF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/shared/styles.css">
  <script type="module" src="/js/dues.js"></script>
</head>
<body class="shell">
  <main class="shell-main" hidden>
    <div class="page-head">
      <h1>Due approvals</h1>
      <nav class="tabs" aria-label="Status">
        <a href="?status=pending" data-status="pending">Waiting</a>
        <a href="?status=approved" data-status="approved">Approved</a>
        <a href="?status=rejected" data-status="rejected">Rejected</a>
      </nav>
    </div>
    <p class="muted small" id="intro"></p>

    <p class="alert alert-error" id="error" role="alert" hidden></p>
    <p class="alert alert-success" id="notice" role="status" hidden></p>

    <div id="list"></div>

    <div class="pager">
      <button type="button" class="btn btn-inline" id="prev">Previous</button>
      <span class="muted small" id="page-info"></span>
      <button type="button" class="btn btn-inline" id="next">Next</button>
    </div>
  </main>
</body>
</html>
