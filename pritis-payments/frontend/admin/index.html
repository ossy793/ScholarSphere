<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Overview · Pritis Admin</title>
  <link rel="icon" type="image/svg+xml" href="/shared/img/favicon.svg">
  <meta name="theme-color" content="#0077FF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/shared/styles.css">
  <script src="/shared/vendor/chart.umd.min.js"></script>
  <script type="module" src="/js/overview.js"></script>
</head>
<body class="shell">
  <main class="shell-main" hidden>
    <div class="page-head"><h1>Welcome, <span id="name"></span></h1></div>
    <p class="alert alert-error" id="error" role="alert" hidden></p>

    <section>
      <h2 class="subhead">Waiting for you</h2>
      <div class="stat-row" id="waiting"></div>
    </section>

    <section id="money" hidden>
      <h2 class="subhead">Money</h2>
      <div class="stat-row" id="money-tiles"></div>
    </section>

    <section id="charts" hidden>
      <h2 class="subhead">Last 30 days</h2>
      <div class="chart-grid cols-2">
        <div class="chart-box">
          <h3>Payments per day</h3>
          <p class="chart-note">Number of successful payments</p>
          <div class="chart-canvas"><canvas id="c-count" aria-label="Payments per day, count"></canvas></div>
          <details class="chart-table"><summary>Show as table</summary></details>
        </div>
        <div class="chart-box">
          <h3>Value paid per day</h3>
          <p class="chart-note">What students paid, service charge included</p>
          <div class="chart-canvas"><canvas id="c-value" aria-label="Payments per day, value"></canvas></div>
          <details class="chart-table"><summary>Show as table</summary></details>
        </div>
        <div class="chart-box">
          <h3>Collections by class</h3>
          <p class="chart-note">Dues collected (reps' share)</p>
          <div class="chart-canvas"><canvas id="c-class" aria-label="Collections by class"></canvas></div>
          <details class="chart-table"><summary>Show as table</summary></details>
        </div>
      </div>
    </section>

    <section>
      <h2 class="subhead">On the platform</h2>
      <div class="stat-row" id="counts"></div>
    </section>
  </main>
</body>
</html>
