<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Staff accounts · Pritis Admin</title>
  <link rel="icon" type="image/svg+xml" href="/shared/img/favicon.svg">
  <meta name="theme-color" content="#0077FF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/shared/styles.css">
  <script type="module" src="/js/staff.js"></script>
</head>
<body class="shell">
  <main class="shell-main" hidden>
    <div class="page-head"><h1>Staff accounts</h1></div>

    <p class="alert alert-error" id="error" role="alert" hidden></p>

    <section class="panel" aria-labelledby="invite-title">
      <h2 id="invite-title">Invite a staff member</h2>
      <p class="muted small">They get an email with a link to set a password and an authenticator app. The link lasts 72 hours.</p>
      <form method="post" id="invite-form" class="form-grid cols-2" novalidate>
        <label>Full name
          <input type="text" name="full_name" required minlength="2" maxlength="200">
        </label>
        <label>Email
          <input type="email" name="email" required>
        </label>
        <label>Role
          <select name="role" required>
            <option value="support">Customer support</option>
            <option value="accountant">Accountant</option>
            <option value="super_admin">Super admin</option>
          </select>
        </label>
        <div class="actions align-end">
          <button type="submit" class="btn btn-primary">Send invitation</button>
        </div>
      </form>
    </section>

    <section class="panel" id="link-panel" hidden aria-live="polite">
      <h2>Invitation link</h2>
      <p class="muted small" id="link-note"></p>
      <div class="copy-box">
        <input type="text" id="invite-link" readonly>
        <button type="button" class="btn btn-inline" id="copy-link">Copy</button>
      </div>
    </section>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last login</th><th>Actions</th></tr>
        </thead>
        <tbody id="staff-rows"></tbody>
      </table>
    </div>
  </main>
</body>
</html>
