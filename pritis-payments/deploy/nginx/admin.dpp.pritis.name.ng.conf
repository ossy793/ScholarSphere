# /etc/nginx/sites-available/admin.dpp.pritis.name.ng  (admin site)

server {
    listen 80;
    listen [::]:80;
    server_name admin.dpp.pritis.name.ng;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.dpp.pritis.name.ng;

    ssl_certificate /etc/letsencrypt/live/dpp.pritis.name.ng/fullchain.pem;  # one certificate covers both names
    ssl_certificate_key /etc/letsencrypt/live/dpp.pritis.name.ng/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/pritis-dues/repo/pritis-payments/frontend/admin;
    index index.html;
    limit_req_status 429;
    client_max_body_size 1m;
    access_log /var/log/nginx/dpp-admin.access.log;
    error_log /var/log/nginx/dpp-admin.error.log;

    # Recommended by the design (section 9): only known addresses reach the admin site.
    # Edit /etc/nginx/snippets/dpp-admin-allow.conf; it allows everyone until you do.
    include snippets/dpp-admin-allow.conf;

    # The user API and the webhook answer only on the user hostname.
    location /api/user/ { return 404; }
    location /api/webhooks/ { return 404; }

    location ~ ^/api/admin/auth/(login|totp|invite/start|invite/accept)$ {
        limit_req zone=dpp_auth burst=60 nodelay;
        include snippets/dpp-proxy.conf;
    }

    location /api/ {
        limit_req zone=dpp_api burst=300 nodelay;
        include snippets/dpp-proxy.conf;
    }

    location /shared/ {
        alias /srv/pritis-dues/repo/pritis-payments/frontend/shared/;
        include snippets/dpp-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
        include snippets/dpp-headers.conf;
    }
}
