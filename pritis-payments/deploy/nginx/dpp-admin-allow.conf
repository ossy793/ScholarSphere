# /etc/nginx/snippets/dpp-admin-allow.conf
# Who may open the admin site. Until you add lines here, everyone can reach the login page
# (staff still need a password and an authenticator code).
#
# To allow only known addresses, list them and finish with "deny all":
#   allow 102.89.10.20;      # office
#   allow 197.210.55.0/24;   # accountant's home network
#   deny all;
# then: sudo nginx -t && sudo systemctl reload nginx
