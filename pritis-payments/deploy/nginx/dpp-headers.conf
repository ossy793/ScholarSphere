# /etc/nginx/snippets/dpp-headers.conf
# Security headers for the static pages (the API adds the same ones itself). Keep in step
# with backend/app/core/security_headers.py. Included in every location that serves files,
# because nginx drops server-level add_header lines in a location that has its own.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# No build step, so no hashed file names: let browsers keep files but check for changes
# (a cheap 304) on every use, so a release is seen at once.
add_header Cache-Control "no-cache" always;
