# /etc/nginx/conf.d/dpp-ratelimit.conf
# Rate-limit zones for Pritis Class Dues (http context). The names start with "dpp_" so
# they can't clash with anything pritis.name.ng defines. The API also limits these routes
# itself (rate_limits table); this stops floods before they reach Python. Generous, because
# a whole class can share one public address (campus Wi-Fi, mobile networks).

limit_req_zone $binary_remote_addr zone=dpp_auth:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=dpp_api:10m rate=30r/s;
# (limit_req_status 429 is set inside the dpp server blocks, so other sites keep their own.)
