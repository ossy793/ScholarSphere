# /etc/nginx/snippets/dpp-proxy.conf
# Passing a request to the API (Uvicorn on 127.0.0.1:8100). X-Forwarded-For is SET to the
# real client address, never appended to, so a visitor can't fake their address to dodge
# rate limits; Uvicorn trusts it only from 127.0.0.1 (--forwarded-allow-ips).

proxy_pass http://127.0.0.1:8100;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Connection "";
proxy_read_timeout 60s;
