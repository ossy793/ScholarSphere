# /etc/nginx/sites-available/dpp.pritis.name.ng  (user site)
# Its own file, its own certificate. Nothing here touches pritis.name.ng.

server {
    listen 80;
    listen [::]:80;
    server_name dpp.pritis.name.ng;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dpp.pritis.name.ng;

    ssl_certificate /etc/letsencrypt/live/dpp.pritis.name.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dpp.pritis.name.ng/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/pritis-dues/repo/pritis-payments/frontend/user;
    index index.html;
    limit_req_status 429;
    client_max_body_size 6m;  # rep proof uploads are at most 5 MB
    access_log /var/log/nginx/dpp.access.log;
    error_log /var/log/nginx/dpp.error.log;

    # The admin API answers only on the admin hostname.
    location /api/admin/ { return 404; }

    # Paystack's webhook (signed; optionally also restrict to Paystack's IP addresses).
    location = /api/webhooks/paystack {
        include snippets/dpp-proxy.conf;
    }

    # Sign-in and sign-up routes: slow down guessing before it reaches the API.
    location ~ ^/api/user/auth/(login|signup|verify-email|resend-code|forgot-password|reset-password)$ {
        limit_req zone=dpp_auth burst=60 nodelay;
        include snippets/dpp-proxy.conf;
    }

    location /api/ {
        limit_req zone=dpp_api burst=300 nodelay;
        include snippets/dpp-proxy.conf;
    }

    location /shared/ {
        alias /srv/pritis-dues/repo/pritis-payments/frontend/shared/;
        include snippets/dpp-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
        include snippets/dpp-headers.conf;
    }
}
