<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#F0F6FF;font-family:Inter,Arial,Helvetica,sans-serif;color:#0A1628;">
  <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #D6E4F7;border-radius:16px;padding:24px;">
    <tr><td>
      <p style="margin:0 0 16px;"><strong>{{ rep_name }}</strong> ({{ class_name }}) has requested a payout of <strong>{{ amount }}</strong>.</p>
      <p style="margin:0 0 20px;color:#4A6080;">After the service charge, {{ net }} will be sent to their bank.</p>
      <p style="margin:0;"><a href="{{ link }}" style="display:inline-block;background:#0077FF;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px;">Review the payout</a></p>
    </td></tr>
  </table>
</body>
</html>
