<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#F0F6FF;font-family:Inter,Arial,Helvetica,sans-serif;color:#0A1628;">
  <table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #D6E4F7;border-radius:16px;padding:24px;">
    <tr><td>
      <p style="margin:0 0 16px;font-size:17px;font-weight:bold;">New support message {{ ticket }}</p>
      <p style="margin:0 0 8px;"><strong>{{ subject }}</strong></p>
      <p style="margin:0 0 16px;color:#4A6080;font-size:14px;">From {{ name }} ({{ email }})</p>
      <p style="margin:0 0 20px;padding:14px;background:#F0F6FF;border-radius:10px;white-space:pre-line;">{{ body }}</p>
      <p style="margin:0;"><a href="{{ link }}" style="display:inline-block;background:#0077FF;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px;">Answer on the admin site</a></p>
    </td></tr>
  </table>
</body>
</html>
