<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#F0F6FF;font-family:Inter,Arial,Helvetica,sans-serif;color:#0A1628;">
  <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #D6E4F7;border-radius:16px;padding:24px;">
    <tr><td>
      <p style="margin:0 0 16px;"><strong>{{ rep_name }}</strong> ({{ class_name }}) wants to change their payout bank account to:</p>
      <p style="margin:0 0 16px;padding:12px;background:#F0F6FF;border-radius:10px;">{{ new_account }}</p>
      <p style="margin:0 0 20px;color:#4A6080;">Their payouts are paused until you approve or reject it. Check the account name matches the rep.</p>
      <p style="margin:0;"><a href="{{ link }}" style="display:inline-block;background:#0077FF;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px;">Review the change</a></p>
    </td></tr>
  </table>
</body>
</html>
