<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#F0F6FF;font-family:Inter,Arial,Helvetica,sans-serif;color:#0A1628;">
  <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #D6E4F7;border-radius:16px;padding:24px;">
    <tr><td>
      <p style="margin:0 0 16px;">Hello {{ full_name }},</p>
      <p style="margin:0 0 16px;">Good news: you're now the verified class rep for <strong>{{ class_name }}</strong>.</p>
      <p style="margin:0 0 20px;">
        <a href="{{ link }}" style="display:inline-block;background:#0077FF;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:10px;">Open your rep dashboard</a>
      </p>
      <p style="margin:0;color:#4A6080;font-size:13px;">Payouts will go to {{ bank_name }} account ending {{ last4 }} ({{ account_name }}).</p>
    </td></tr>
  </table>
</body>
</html>
