services:
  - type: web
    name: pritis-backend
    env: python
    rootDir: backend
    buildCommand: apt-get update && apt-get install -y tesseract-ocr poppler-utils libreoffice && pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --workers 2
